name: Identify a framework gap
description: Describe a governance problem the current framework does not adequately address.
title: "[Gap]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: The unresolved problem
      description: Describe the concrete situation and who is affected.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why the current framework is insufficient
      description: Point to the relevant principle, carrier, template, manifest field, trust assumption, enforcement path, evidence requirement, or missing layer.
    validations:
      required: true
  - type: textarea
    id: existing
    attributes:
      label: Existing approaches
      description: Link relevant standards, research, tools, or practices and explain what they cover.
    validations:
      required: false
  - type: textarea
    id: direction
    attributes:
      label: Possible direction
      description: Suggest a repair or test without assuming the repository must adopt it.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication check
      options:
        - label: I removed credentials, personal data, and non-public employer, client, or third-party information.
          required: true
